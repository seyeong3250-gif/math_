        body {
            font-family: 'Yeongdeok Sea', 'Jua', sans-serif;
            background-color: #fef6e4;
            user-select: none;
        }
        /* 저울 흔들림 및 기울기 애니메이션 */
        .scale-beam {
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center center;
        }
        /* 등호 반짝임 애니메이션 */
        @keyframes glowPulse {
            0% { transform: scale(1); text-shadow: 0 0 5px #facc15, 0 0 10px #facc15; color: #ca8a04; }
            50% { transform: scale(1.25); text-shadow: 0 0 20px #eab308, 0 0 30px #fde047; color: #facc15; }
            100% { transform: scale(1); text-shadow: 0 0 5px #facc15, 0 0 10px #facc15; color: #ca8a04; }
        }
        .equals-glow {
            animation: glowPulse 0.8s infinite ease-in-out;
        }
        /* 둥근 도트 배경 효과 */
        .dot-bg {
            background-image: radial-gradient(#fcd34d 2px, transparent 2px);
            background-size: 24px 24px;
        }
        /* 귀여운 흔들림 효과 */
        @keyframes floatAnim {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .floating {
            animation: floatAnim 3s ease-in-out infinite;
        }
        /* 더하기 / 빼기 파스텔 블록 */
        .btn-minus { background: #cfe8ff; border: 2px solid #9bcbf5; color: #35709f; }
        .btn-minus:hover { background: #bddcfb; }
        .btn-plus { background: #ffd9e3; border: 2px solid #f7a8bf; color: #b24a6f; }
        .btn-plus:hover { background: #ffc9d8; }
        /* 저울 접시: 얕은 그릇 모양, 물건은 접시 위에 놓임 */
        .pan {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            align-content: flex-end;
            justify-content: center;
            height: 20px;
            padding-bottom: 20px; /* 물체가 접시 테두리 위에서 시작하도록 */
        }
        .pan > * { position: relative; z-index: 1; margin-bottom: 4px; }
        .pan::before { /* 접시 앞쪽 테두리 */
            content: '';
            position: absolute;
            left: -8px; right: -8px; top: 2px;
            height: 8px;
            border-radius: 999px;
            background: #fde68a;
            border: 3px solid #b45309;
            z-index: 2;
        }
        .pan::after { /* 접시 몸통 */
            content: '';
            position: absolute;
            left: 2px; right: 2px; top: 7px; bottom: 0;
            background: linear-gradient(#fcd34d, #f59e0b);
            border: 3px solid #b45309;
            border-top: none;
            border-radius: 0 0 34px 34px / 0 0 12px 12px;
            z-index: 0;
        }
        /* 정답 모달: 한 번만 부드럽게 나타남 */
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-pop { animation: modalPop 0.25s ease-out; }
        /* 괴물 말풍선 */
        .speech-bubble {
            position: relative;
            background: #fff;
            border: 3px solid #fbbf24;
            border-radius: 1.25rem;
            padding: 0.5rem 1.1rem;
            box-shadow: 0 3px 8px rgba(180, 120, 20, 0.2);
        }
        .speech-bubble::before { /* 꼬리: 항상 괴물 사진(왼쪽)을 향함 */
            content: '';
            position: absolute;
            top: 50%; left: -9px;
            width: 14px; height: 14px;
            background: #fff;
            border-left: 3px solid #fbbf24;
            border-top: 3px solid #fbbf24;
            transform: translateY(-50%) rotate(-45deg);
        }

                    <span>+</span>
                    <!-- 유저가 맞추거나 선택하는 빈칸 또는 별사탕 -->
                    <div id="target-box" class="bg-amber-100 border-2 border-dashed border-amber-500 px-3 py-0.5 rounded-lg text-amber-900 min-w-[40px] md:min-w-[56px] text-center">?</div>
                </div>
            </div>

            <!-- 저울 그래픽 (물리 시뮬레이션 기둥 및 받침대) -->
            <div class="relative w-full h-52 md:h-56 flex flex-col items-center justify-end">
                
                <!-- 저울 중앙 지지대 -->
                <div class="absolute bottom-0 top-[46px] w-6 bg-amber-500 rounded-t-xl border-2 border-amber-600 shadow-md"></div>
                <div class="absolute bottom-0 w-24 h-4 bg-amber-600 rounded-lg shadow-md"></div>
                <div class="absolute top-[30px] w-8 h-8 bg-amber-700 rounded-full border-2 border-amber-300 z-20 shadow"></div>

                <!-- 기울어지는 저울대 (Scale Beam) -->
                <div id="scale-beam" class="scale-beam absolute top-10 w-[calc(100%-7rem)] md:w-[20rem] h-3 bg-amber-600 rounded-full border-2 border-amber-700 z-10 flex justify-between items-center px-4">
                    
                    <!-- 왼쪽 접시 및 매달린 줄 -->
                    <div id="left-hanger" class="absolute left-0 -ml-14 md:-ml-20 top-3 flex flex-col items-center" style="transform-origin: top center; transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);">
                        <svg class="w-28 md:w-40 h-16" viewBox="0 0 100 64" preserveAspectRatio="none" aria-hidden="true"><path d="M50 0 L3 64 M50 0 L97 64" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" style="vector-effect: non-scaling-stroke"/></svg>
                        <!-- 왼쪽 저울 접시 (별사탕이 올라가는 곳) -->
                        <div id="left-plate" class="pan w-28 md:w-40 gap-1 px-2">
                            <!-- 별사탕 아이템들이 여기에 동적으로 추가됨 -->
                        </div>
                        <div class="text-sm font-bold text-amber-800 mt-1 bg-white/80 px-2 rounded-full border border-amber-300">
                            무게: <span id="weight-left">6</span>
                        </div>
                    </div>

                    <!-- 오른쪽 접시 및 매달린 줄 -->
                    <div id="right-hanger" class="absolute right-0 -mr-14 md:-mr-20 top-3 flex flex-col items-center" style="transform-origin: top center; transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);">
                        <svg class="w-28 md:w-40 h-16" viewBox="0 0 100 64" preserveAspectRatio="none" aria-hidden="true"><path d="M50 0 L3 64 M50 0 L97 64" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" style="vector-effect: non-scaling-stroke"/></svg>
                        <!-- 오른쪽 저울 접시 -->
                        <div id="right-plate" class="pan w-28 md:w-40 gap-1 px-2">
                            <!-- 별사탕 아이템들이 여기에 동적으로 추가됨 -->
                        </div>
                        <div class="text-sm font-bold text-amber-800 mt-1 bg-white/80 px-2 rounded-full border border-amber-300">
                            무게: <span id="weight-right">6</span>
                        </div>
                    </div>
                </div>

            </div>

        </div>

        <!-- 하단 조작 패널 (별사탕 올리기 및 정답 제출) -->
        <div class="w-full bg-white/90 border-4 border-amber-300 rounded-3xl p-4 shadow-lg mt-4 flex flex-col gap-3">
            <div class="flex items-center">
                <span class="text-lg md:text-xl font-bold text-amber-900">🌟 오른쪽 저울 채우기</span>
            </div>

            <!-- 숫자 조절 버튼 및 별사탕 인벤토리 -->
            <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-3 flex-grow">
                    <button onclick="adjustAnswer(-1)" class="btn-minus flex-1 h-12 rounded-2xl text-3xl leading-none font-black active:scale-95 transition shadow" aria-label="빼기">−</button>
                    <div id="user-input-val" class="flex-1 h-12 bg-amber-50 border-2 border-amber-400 rounded-2xl flex items-center justify-center text-2xl font-black text-amber-900 shadow-inner">4</div>
                    <button onclick="adjustAnswer(1)" class="btn-plus flex-1 h-12 rounded-2xl text-3xl leading-none font-black active:scale-95 transition shadow" aria-label="더하기">+</button>
                </div>

                <!-- 토벌 확인 버튼 -->
                <button id="submit-btn" onclick="checkAnswer()" class="whitespace-nowrap bg-gradient-to-r from-amber-400 to-orange-400 hover:from-amber-500 hover:to-orange-500 text-white font-black text-xl py-3 px-5 rounded-2xl border-2 border-amber-500 shadow-lg active:scale-95 transition flex items-center justify-center gap-2">
                    ⚔️ 토벌하기! (= 맞추기)
                </button>
            </div>
        </div>

    </main>

    <!-- 성공 축하 모달 팝업 -->
    <div id="success-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white border-4 border-amber-400 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl flex flex-col items-center modal-pop">
            <div class="trio-img w-44 mb-2" role="img" aria-label="치이카와, 하치와레, 우사기"></div>
            <div class="text-4xl mb-2">🎉✨</div>
            <h2 class="text-3xl font-black text-amber-900 mb-1">저울 괴물 토벌 성공!</h2>
            <p id="success-msg" class="text-base font-bold text-amber-700 mb-4">완벽하게 무게가 일치했습니다!</p>
            <button onclick="nextStage()" class="w-full bg-amber-400 hover:bg-amber-500 text-amber-950 font-black py-3 rounded-2xl border-2 border-amber-500 shadow-md text-xl active:scale-95 transition">
                다음 스테이지로 진격! 🚀
            </button>
        </div>
    </div>

    <!-- 게임 설명 푸터 -->
    <footer class="mt-4 text-sm text-amber-800 font-bold opacity-80 text-center">
        먼작귀 친구들의 즐거운 수학 토벌 시뮬레이터 💛
    </footer>

    <!-- 게임 로직 제어 스크립트 -->
    <script>
        // 게임 상태 관리 객체
        let gameState = {
            stage: 1,
            maxStages: 4,
            leftBase: 5,
            leftVar: 1,
            rightBase: 2,
            rightVar: 4, // 유저가 조절하는 값 (초기값)
            userAnswer: 4,
            isCleared: false
        };

        // 스테이지별 고정수 및 변화수 패턴 데이터 (사진 속 문제 패턴 반영)
        const stageData = [
            { stage: 1, leftBase: 5, leftVar: 1, rightBase: 2, initialRightVar: 1 }, // 시작값 (틀린 상태로 시작해 유저가 맞추게 함)
            { stage: 2, leftBase: 5, leftVar: 2, rightBase: 2, initialRightVar: 2 },
            { stage: 3, leftBase: 5, leftVar: 3, rightBase: 2, initialRightVar: 2 },
            { stage: 4, leftBase: 5, leftVar: 4, rightBase: 2, initialRightVar: 3 }
        ];

        // 게임 초기화
        function initGame() {
            const current = stageData[gameState.stage - 1];
            gameState.leftBase = current.leftBase;
            gameState.leftVar = current.leftVar;
            gameState.rightBase = current.rightBase;
            gameState.userAnswer = current.initialRightVar;
            gameState.isCleared = false;

            document.getElementById('stage-level').innerText = gameState.stage;
            document.getElementById('success-modal').classList.add('hidden');
            document.getElementById('equality-sign').classList.remove('equals-glow', 'text-amber-500');
            document.getElementById('equality-sign').classList.add('text-gray-400');

            updateUI();
        }

        // 값 조절 버튼 클릭 (+ / -)
        function adjustAnswer(delta) {
            if (gameState.isCleared) return;
            gameState.userAnswer += delta;
            // 범위 제한 (1 ~ 10)
            if (gameState.userAnswer < 1) gameState.userAnswer = 1;
            if (gameState.userAnswer > 10) gameState.userAnswer = 10;

            updateUI();
        }

        // UI 업데이트 (저울 기울기, 별사탕 개수, 수식 렌더링)
        function updateUI() {
            // 1. 수식 반영
            document.getElementById('q-left-base').innerText = gameState.leftBase;
            document.getElementById('q-left-var').innerText = gameState.leftVar;
            document.getElementById('q-right-base').innerText = gameState.rightBase;
            document.getElementById('target-box').innerText = gameState.userAnswer;
            document.getElementById('user-input-val').innerText = gameState.userAnswer;

            // 2. 실제 무게 계산
            const leftTotal = gameState.leftBase + gameState.leftVar;
            const rightTotal = gameState.rightBase + gameState.userAnswer;

            document.getElementById('weight-left').innerText = leftTotal;
            document.getElementById('weight-right').innerText = rightTotal;

            // 3. 저울 접시에 별사탕 아이콘 렌더링
            renderLeftPlate(gameState.leftBase, gameState.leftVar);
            renderStarCandy('right-plate', rightTotal);

            // 4. 저울 기울기 물리 애니메이션 계산 (좌우 무게 차이에 따라 기울어짐)
            const weightDiff = rightTotal - leftTotal; // 양수면 오른쪽이 무거움, 음수면 왼쪽이 무거움
            const tiltAngle = Math.max(-15, Math.min(15, weightDiff * 4)); // 최대 15도까지만 기울임
            
            const beam = document.getElementById('scale-beam');
            beam.style.transform = `rotate(${tiltAngle}deg)`;
            // 접시는 반대로 돌려서 항상 똑바로 매달려 있게 함
            document.getElementById('left-hanger').style.transform = `rotate(${-tiltAngle}deg)`;
            document.getElementById('right-hanger').style.transform = `rotate(${-tiltAngle}deg)`;

            // 5. 양쪽 무게가 같으면 = 기호가 바로 빛남
            const eq = document.getElementById('equality-sign');
            if (leftTotal === rightTotal) {
                eq.classList.remove('text-gray-400');
                eq.classList.add('equals-glow');
            } else {
                eq.classList.remove('equals-glow');
                eq.classList.add('text-gray-400');
            }
        }

        // 접시 안에 별사탕 이모지 생성 함수
        // 왼쪽 접시: 기본 무게(5)는 항상 올라가 있는 돌 + 더해지는 무게도 돌
        function renderLeftPlate(baseWeight, addedCount) {
            const plate = document.getElementById('left-plate');
            plate.innerHTML = '';
            for (let i = 0; i < baseWeight + addedCount; i++) {
                const stone = document.createElement('span');
                stone.className = 'text-xl md:text-2xl leading-none';
                stone.innerText = '🪨';
                // 더해지는 돌(기본 5개 이후)은 더 진하게
                if (i >= baseWeight) stone.style.filter = 'brightness(0.5) contrast(1.15)';
                plate.appendChild(stone);
            }
        }

        function renderStarCandy(plateId, count) {
            const plate = document.getElementById(plateId);
            plate.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const star = document.createElement('span');
                star.className = 'text-lg md:text-xl leading-none animate-pulse';
                star.innerText = '⭐';
                plate.appendChild(star);
            }
        }

        // 정답 확인 및 토벌 로직
        function checkAnswer() {
            if (gameState.isCleared) return;

            const leftTotal = gameState.leftBase + gameState.leftVar;
            const rightTotal = gameState.rightBase + gameState.userAnswer;

            const equalitySign = document.getElementById('equality-sign');

            if (leftTotal === rightTotal) {
                // 성공!
                gameState.isCleared = true;
                equalitySign.classList.remove('text-gray-400');
                equalitySign.classList.add('equals-glow');

                setTimeout(() => {
                    document.getElementById('success-modal').classList.remove('hidden');
                    document.getElementById('success-modal').classList.add('flex');
                }, 500);
            } else {
                // 실패 / 불일치
                equalitySign.classList.remove('equals-glow');
                equalitySign.classList.add('text-gray-400');

                // 틀렸을 때 저울이 부르르 떨리는 효과
                const beam = document.getElementById('scale-beam');
                beam.classList.add('animate-ping');
                setTimeout(() => beam.classList.remove('animate-ping'), 300);
            }
        }

        // 다음 스테이지 진행
        function nextStage() {
            if (gameState.stage < gameState.maxStages) {
                gameState.stage++;
                initGame();
            } else {
                // 모든 스테이지 클리어 완료
                document.getElementById('success-msg').innerText = "모든 저울 괴물을 완벽하게 토벌했습니다! 🏆";
                document.querySelector('#success-modal button').innerText = "처음부터 다시 토벌하기 🔄";
                document.querySelector('#success-modal button').onclick = () => {
                    gameState.stage = 1;
                    initGame();
                };
            }
        }

        // 페이지 로드 시 초기화 실행
        // 제목이 한 줄에 박스를 넘지 않도록 글씨 크기 자동 조절
        function fitTitle() {
            const title = document.getElementById('main-title');
            let size = 34;
            title.style.fontSize = size + 'px';
            while (title.scrollWidth > title.clientWidth && size > 10) {
                size -= 0.5;
                title.style.fontSize = size + 'px';
            }
        }
        window.addEventListener('resize', fitTitle);

        window.onload = function() {
            initGame();
            fitTitle();
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);
        };
    </script>
</body>
</html>
